# All geometry uses metres, z-up. The robot is posed at ball release.
env:
  type: robotics_lab
  params:
    dt: 0.001
    total_steps: 1600
    table_height: 0.86
    table_bounds: [-1.4, 1.6, -0.7, 0.7]
    cup_position: [0.85, -0.12, 1.08]
    cup_radius: 0.105
    cup_height: 0.22
    ball_radius: 0.04

task:
  type: shoot_ball
  params:
    ball_position: [-0.45, -0.12, 1.35]
    ball_radius: 0.04
    cup_position: [0.85, -0.12, 1.08]
    cup_radius: 0.105

simulation:
  velocity: [2.4, 0.0, 2.15]

renderer:
  projection: "3d"
  xlim: [-1.5, 1.7]
  ylim: [-1, 1]
  figsize: [10, 7]

scene:
  style: robotics_lab
  seed: 7
  # A still at release shows the gripper; step 260 shows the ball in flight.
  preview_step: 0
  robot_base: [-0.90, 0.20, 0.86]
  camera:
    position: [3.6, -5.6, 3.1]
    target: [0.0, 0.25, 1.10]
    lens: 48
    fstop: 7.1
